server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # GZIP Sıkıştırma (Core Web Vitals & Hızlı Yükleme)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Dokploy Traefik / Reverse Proxy arkasında www -> non-www yönlendirmesi
    if ($host = www.eycodex.com) {
        return 301 https://eycodex.com$request_uri;
    }

    # Canonical: /index.html -> /
    if ($request_uri ~* "^/index\.html(\?.*)?$") {
        return 301 /$1;
    }

    # Canonical Clean URL: Herhangi bir .html isteğini uzantısız temiz URL'ye 301 yönlendir
    if ($request_uri ~* "^/(.+)\.html(\?.*)?$") {
        return 301 /$1$2;
    }

    # Temiz URL yönlendirme (örn: /hakkimizda -> hakkimizda.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Statik Varlıklar ve Medya Önbellekleme (1 Yıl Immutable Cache)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|webp|svg|ico|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Gizli dosyalara erişimi engelle (.git, .env vb.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # robots.txt ve sitemap.xml
    location = /robots.txt { log_not_found off; access_log off; }
    location = /sitemap.xml { log_not_found off; access_log off; }

    # 404 Hata Sayfası
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
